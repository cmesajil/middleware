services:

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  postgres:
    image: postgres:latest
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - ./data/postgres/postgres-init.sql:/docker-entrypoint-initdb.d/postgres-init.sql

  backend:
    build: ./backend-correos
    depends_on:
      - rabbitmq
      - postgres

  ia:
    build: ./nodo-ia
    depends_on:
      - rabbitmq

  cliente:
    build: ./cliente
    stdin_open: true
    tty: true
    depends_on:
      - rabbitmq
